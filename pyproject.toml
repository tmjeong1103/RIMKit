[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.4",
  "mujoco==3.6.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "core-retarget"
version = "0.1.0.dev0"
description = "Contact-aware human-to-humanoid motion retargeting for SOMA motion"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Taemoon Jeong", email = "taemoon-jeong@korea.ac.kr" }]
maintainers = [{ name = "Taemoon Jeong", email = "taemoon-jeong@korea.ac.kr" }]
keywords = ["humanoid", "motion-retargeting", "mujoco", "robotics", "soma"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  # Collision kernels are built and tested against this MuJoCo ABI.
  "mujoco==3.6.0",
  "cvxpy>=1.5",
  "clarabel>=0.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
]
video = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10",
]
web = [
  "fastapi>=0.115",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10",
  "python-multipart>=0.0.12",
  "uvicorn>=0.30",
]

[project.scripts]
core-retarget = "core_retarget.cli.main:main"

[project.urls]
Repository = "https://github.com/tmjeong1103/CoRe"
Issues = "https://github.com/tmjeong1103/CoRe/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/core_retarget"]
wheel.install-dir = ""
wheel.cmake = true
wheel.platlib = true
wheel.license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "licenses/*.txt",
]
sdist.include = [
  "/CMakeLists.txt",
  "/cpp/**",
  "/examples/**",
  "/licenses/**",
  "/src/core_retarget/web/static/**",
  "/src/core_retarget/web/templates/**",
  "/THIRD_PARTY_NOTICES.md",
]
sdist.exclude = [
  "/.venv/**",
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/build/**",
  "/dist/**",
  "/docs/media/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.ipynb",
  "**/*.pkl",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "mujoco: requires MuJoCo model loading",
  "slow: full or long-running regression test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["core_retarget"]
mypy_path = "src"
